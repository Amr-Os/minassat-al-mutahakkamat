    sdk: flutter
  ffi: ^2.2.0
  qr_flutter: ^4.1.0
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
